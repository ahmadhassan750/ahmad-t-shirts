name: Repair Ahmad T-Shirts site
on:
  push:
    paths:
      - '.github/workflows/repair-site-functionality.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair assets, 3D motion and WhatsApp CTA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [p for p in Path('.').glob('*.html')]
          js = r'''(() => {
            const FRONT='https://raw.githubusercontent.com/ahmadhassan750/ahmad-t-shirts/main/assets/product-front.webp';
            const BACK='https://raw.githubusercontent.com/ahmadhassan750/ahmad-t-shirts/main/assets/product-back.webp';
            const WA='https://wa.me/923341903823?text=Assalam-o-Alaikum%20Ahmad%20T-Shirts%2C%20I%20want%20to%20place%20an%20order.';
            function init(){
              document.querySelectorAll('img').forEach((img,i)=>{
                img.addEventListener('error',()=>{
                  if(img.dataset.fallback) return;
                  img.dataset.fallback='1'; img.src=(i%2?BACK:FRONT);
                },{once:true});
                img.classList.add('motion-media');
              });
              document.querySelectorAll('.card,.category,.productCard,.product-card,.box,.content section').forEach(el=>el.classList.add('motion-card'));
              const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target)}}),{threshold:.08});
              document.querySelectorAll('.motion-card,.motion-media').forEach(el=>io.observe(el));
              document.querySelectorAll('.motion-card').forEach(el=>{
                el.addEventListener('pointermove',e=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return; const r=el.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5; el.style.transform=`perspective(900px) rotateX(${(-y*4).toFixed(2)}deg) rotateY(${(x*5).toFixed(2)}deg) translateY(-3px)`});
                el.addEventListener('pointerleave',()=>el.style.transform='');
              });
              if(!document.querySelector('.whatsapp-float')){
                const a=document.createElement('a'); a.className='whatsapp-float'; a.href=WA; a.target='_blank'; a.rel='noopener'; a.innerHTML='<span class="wa-icon">⌕</span><span>ORDER ON WHATSAPP</span>'; document.body.appendChild(a);
              }
              document.querySelectorAll('a').forEach(a=>{ if(/whatsapp/i.test(a.textContent||'')) a.target='_blank'; });
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
          })();'''
          Path('assets/site-enhancements.js').write_text(js, encoding='utf-8')

          css = Path('pages.css').read_text(encoding='utf-8')
          css += r'''
          .motion-card{transform-style:preserve-3d;transition:transform .28s ease,box-shadow .28s ease,opacity .55s ease;will-change:transform;opacity:0;transform:translateY(22px)}
          .motion-card.is-visible{opacity:1;transform:translateY(0)}
          .motion-card:hover{box-shadow:0 18px 45px rgba(0,0,0,.12)}
          .motion-media{transition:transform .45s ease,filter .45s ease;will-change:transform}
          .motion-card:hover .motion-media{transform:scale(1.035);filter:saturate(1.05)}
          .whatsapp-float{position:fixed;right:22px;bottom:22px;z-index:9999;display:flex;align-items:center;gap:9px;background:#25D366;color:#fff!important;padding:13px 18px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:1px;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:transform .2s ease,box-shadow .2s ease}
          .whatsapp-float:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 15px 35px rgba(0,0,0,.28)}
          .wa-icon{width:22px;height:22px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1}
          @media(max-width:600px){.whatsapp-float{right:12px;bottom:12px;padding:12px 14px;font-size:9px}.whatsapp-float span:last-child{display:none}.whatsapp-float .wa-icon{width:28px;height:28px}}
          @media(prefers-reduced-motion:reduce){.motion-card,.motion-media{transition:none!important;transform:none!important;opacity:1!important}}
          '''
          Path('pages.css').write_text(css, encoding='utf-8')

          for p in pages:
            s=p.read_text(encoding='utf-8')
            if 'assets/site-enhancements.js' not in s:
              s=s.replace('</body>','<script src="assets/site-enhancements.js"></script></body>')
            # Use stable repo-hosted images for the existing product-image references.
            s=re.sub(r'https://[^\"\']+\.(?:jpg|jpeg|png|webp)(?:\?[^\"\']*)?', 'https://raw.githubusercontent.com/ahmadhassan750/ahmad-t-shirts/main/assets/product-front.webp', s, flags=re.I)
            p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Repair images, 3D animations and WhatsApp ordering'
          git push
