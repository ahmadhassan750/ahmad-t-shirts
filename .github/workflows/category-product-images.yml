name: Upgrade product and category visuals
on:
  push:
    paths:
      - '.github/workflows/category-product-images.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add product-style category visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          css='''\n<style id="ahmad-category-visuals">\n.category{background:#e9e9e9!important;color:#fff!important;isolation:isolate}\n.category:before{z-index:0!important;background:linear-gradient(180deg,#0000 35%,#000b 100%)!important}\n.category:after{display:none!important}\n.category .categoryImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;transition:transform .55s ease,filter .55s ease;filter:saturate(.95) contrast(1.02)}\n.category:hover .categoryImage{transform:scale(1.045);filter:saturate(1.08) contrast(1.03)}\n.category div{z-index:3!important}\n.category h3,.category p{color:#fff!important;text-shadow:0 2px 14px #0008}\n@media(max-width:650px){.category{height:250px!important}}\n</style>\n'''
          if 'ahmad-category-visuals' not in s:
              s=s.replace('</head>',css+'</head>',1)
          js='''\n<script id="ahmad-category-images">\ndocument.addEventListener('DOMContentLoaded',function(){\n  var imgs=[\n    "https://outfitters.com.pk/cdn/shop/files/F2018106901.jpg?v=1776926796&width=533",\n    "https://outfitters.com.pk/cdn/shop/files/F1707106901_c0c73117-2b86-4723-8986-bbaf99e839d3.jpg?v=1771482900",\n    "https://outfitters.com.pk/cdn/shop/files/F1699106117_10.jpg?v=1770099398",\n    "https://outfitters.com.pk/cdn/shop/files/F1711106720.jpg?v=1769665825"\n  ];\n  /* Use original Ahmad T-Shirts product artwork for the live shop; these image references are only visual inspiration and are not copied into product data. */\n  var cats=document.querySelectorAll('.category');\n  cats.forEach(function(c,i){\n    var img=document.createElement('div');\n    img.className='categoryImage';\n    img.setAttribute('aria-hidden','true');\n    img.style.background='linear-gradient(180deg,#222,#777)';\n    c.insertBefore(img,c.firstChild);\n  });\n  var productImgs=Array.from(document.querySelectorAll('.productVisual img'));\n  cats.forEach(function(c,i){\n    var src=productImgs[i] ? productImgs[i].getAttribute('src') : null;\n    if(src){\n      var el=c.querySelector('.categoryImage');\n      el.style.backgroundImage='url("'+src.replace(/"/g,'\\\\"')+'")';\n      el.style.backgroundSize='cover';\n      el.style.backgroundPosition='center';\n    }\n  });\n});\n</script>\n'''
          if 'ahmad-category-images' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Improve product and shop by category visuals'
          git push
