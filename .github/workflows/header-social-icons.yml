name: Add header social icons
on:
  push:
    paths:
      - '.github/workflows/header-social-icons.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add social icons beside cart
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<div class="actions">'
          old='''<div class="actions"><button class="action" onclick="focusSearch()" aria-label="Search">⌕</button><button class="action" onclick="openCart()" aria-label="Cart">🛒<sup class="cartCount" id="cartCount">0</sup></button><button class="mobileMenu" onclick="toggleMobile()">☰</button></div>'''
          new='''<div class="actions"><button class="action" onclick="focusSearch()" aria-label="Search">⌕</button><div class="headerSocials" aria-label="Social media"><a class="headerSocial facebook" href="https://www.facebook.com/AhmadTshirts" target="_blank" rel="noopener" aria-label="Facebook">f</a><a class="headerSocial instagram" href="https://www.instagram.com/ahmadtshirts1/" target="_blank" rel="noopener" aria-label="Instagram">◎</a><a class="headerSocial tiktok" href="https://www.tiktok.com/@ahmadtshirts" target="_blank" rel="noopener" aria-label="TikTok">♪</a><a class="headerSocial youtube" href="https://www.youtube.com/@ahmadtshirt" target="_blank" rel="noopener" aria-label="YouTube">▶</a></div><button class="action cartAction" onclick="openCart()" aria-label="Cart">🛒<sup class="cartCount" id="cartCount">0</sup></button><button class="mobileMenu" onclick="toggleMobile()">☰</button></div>'''
          if old not in s:
              raise SystemExit('header actions pattern not found')
          s=s.replace(old,new,1)
          css='''\n<style id="ahmad-header-social-icons">\n.headerSocials{display:flex;align-items:center;gap:5px;margin:0 3px}.headerSocial{width:28px;height:28px;border:1px solid #ddd;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#111;font-size:12px;font-weight:900;transition:all .25s}.headerSocial:hover{background:#111;color:#fff;border-color:#111;transform:translateY(-2px)}.headerSocial.instagram{font-size:17px}.headerSocial.tiktok{font-size:14px}.headerSocial.youtube{font-size:11px}.cartAction{margin-left:2px}@media(max-width:1000px){.headerSocials{gap:3px}.headerSocial{width:26px;height:26px}}@media(max-width:650px){.headerSocials{display:none}}\n</style>\n'''
          if 'id="ahmad-header-social-icons"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add social icons beside cart in header"
          git push
